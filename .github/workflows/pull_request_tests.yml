name: Pytests

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.9'

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
        fetch-tags: true
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        pixi-version: v0.62.2
        cache: true
    - name: Override Python version for testing
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[test] .[dev]
    - name: Run pytest
      run: |
        pixi run -e test pytest -v --disable-warnings